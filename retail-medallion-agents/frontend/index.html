<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Sales Medallion Pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #4f8ef7;
      --green: #2ecc71;
      --red: #e74c3c;
      --yellow: #f39c12;
      --grey: #555;
      --text: #e0e0e0;
      --muted: #888;
      --radius: 10px;
      --mono: 'Courier New', Courier, monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a1a2e 100%);
      border-bottom: 1px solid #2a2a4e;
      padding: 24px 32px;
    }
    header h1 { font-size: 1.8rem; color: var(--accent); letter-spacing: -0.5px; }
    header p { color: var(--muted); margin-top: 4px; font-size: 0.9rem; }

    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }

    /* ── Upload ── */
    .upload-card {
      background: var(--card);
      border: 2px dashed #2a2a4e;
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      transition: border-color .2s;
      cursor: pointer;
    }
    .upload-card.drag-over { border-color: var(--accent); background: #1a1a3e; }
    .upload-card .icon { font-size: 3rem; }
    .upload-card p { color: var(--muted); margin-top: 8px; }
    .file-info { margin-top: 12px; font-size: 0.9rem; color: var(--accent); }

    #file-input { display: none; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: opacity .2s, transform .1s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .85; }
    .btn:not(:disabled):active { transform: scale(.97); }

    /* ── Progress ── */
    #pipeline-section { display: none; margin-top: 32px; }
    #pipeline-section h2 { font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; letter-spacing: .05em; text-transform: uppercase; }

    .agent-card {
      background: var(--card);
      border-left: 4px solid var(--grey);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color .3s;
    }
    .agent-card.running { border-left-color: var(--accent); }
    .agent-card.done    { border-left-color: var(--green); }
    .agent-card.error   { border-left-color: var(--red); background: #1f1010; }

    .agent-header {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .agent-icon { font-size: 1.4rem; margin-right: 12px; }
    .agent-name { font-weight: 600; flex: 1; }
    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: var(--grey);
      color: #fff;
    }
    .status-badge.running { background: var(--accent); animation: pulse 1.2s infinite; }
    .status-badge.done    { background: var(--green); }
    .status-badge.error   { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .agent-message { padding: 0 18px 4px 44px; font-size: 0.88rem; color: var(--muted); }

    .agent-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease;
    }
    .agent-detail.open { max-height: 500px; }
    .agent-detail pre {
      background: #111;
      color: #a8d8ea;
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 14px 18px;
      overflow-x: auto;
      border-top: 1px solid #222;
    }

    /* ── Report ── */
    #report-section { display: none; margin-top: 32px; }
    .report-card {
      background: linear-gradient(135deg, #0d2137 0%, #1a1a2e 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 28px 32px;
    }
    .report-card h2 { color: var(--accent); font-size: 1.2rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .stat-box {
      background: var(--card2);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .stat-box .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .stat-box .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .report-btn {
      display: inline-block;
      margin-top: 20px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      transition: opacity .2s;
    }
    .report-btn:hover { opacity: .85; }

    /* ── Error banner ── */
    #error-banner {
      display: none;
      background: #2a0a0a;
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>&#127970; Retail Sales Medallion Pipeline</h1>
  <p>Powered by AI Agents — Bronze &rarr; Silver &rarr; Gold</p>
</header>

<main>

  <!-- Upload -->
  <div class="upload-card" id="drop-zone">
    <div class="icon">&#128196;</div>
    <p>Drag &amp; drop a CSV file here, or click to browse</p>
    <div class="file-info" id="file-info"></div>
    <input type="file" id="file-input" accept=".csv" />
  </div>
  <div style="text-align:center">
    <button class="btn" id="run-btn" disabled>&#9654; Run Pipeline</button>
  </div>

  <div id="error-banner"></div>

  <!-- Pipeline progress -->
  <div id="pipeline-section">
    <h2>Pipeline Progress</h2>
    <div id="agents-container"></div>
  </div>

  <!-- Report -->
  <div id="report-section">
    <div class="report-card">
      <h2>&#127942; Pipeline Complete</h2>
      <div class="stats-grid" id="stats-grid"></div>
      <button class="report-btn" id="open-report-btn">&#128203; View Full Report</button>
    </div>
  </div>

</main>

<script>
  const AGENTS = [
    { id: 'profiler', label: 'Data Profiler',    icon: '&#128270;' },
    { id: 'sttm',    label: 'STTM Designer',     icon: '&#128204;' },
    { id: 'bronze',  label: 'Bronze Layer',       icon: '&#129695;' },
    { id: 'silver',  label: 'Silver Layer',       icon: '&#129689;' },
    { id: 'gold',    label: 'Gold Layer',         icon: '&#127944;' },
    { id: 'reporter',label: 'Reporter',           icon: '&#128202;' },
    { id: 'orchestrator', label: 'Complete',      icon: '&#9989;' },
  ];

  let selectedFile = null;
  let reportUrl = null;

  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const fileInfo   = document.getElementById('file-info');
  const runBtn     = document.getElementById('run-btn');
  const pipeSec    = document.getElementById('pipeline-section');
  const agentsCont = document.getElementById('agents-container');
  const reportSec  = document.getElementById('report-section');
  const statsGrid  = document.getElementById('stats-grid');
  const openRepBtn = document.getElementById('open-report-btn');
  const errBanner  = document.getElementById('error-banner');

  // ── File selection ────────────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  function setFile(f) {
    selectedFile = f;
    fileInfo.textContent = `${f.name}  (${(f.size / 1024).toFixed(1)} KB)`;
    runBtn.disabled = false;
  }

  // ── Build agent cards ────────────────────────────────────────────────────
  function buildCards() {
    agentsCont.innerHTML = '';
    AGENTS.forEach(ag => {
      const card = document.createElement('div');
      card.className = 'agent-card';
      card.id = `card-${ag.id}`;
      card.innerHTML = `
        <div class="agent-header" onclick="toggleDetail('${ag.id}')">
          <span class="agent-icon">${ag.icon}</span>
          <span class="agent-name">${ag.label}</span>
          <span class="status-badge" id="badge-${ag.id}">idle</span>
        </div>
        <div class="agent-message" id="msg-${ag.id}"></div>
        <div class="agent-detail" id="detail-${ag.id}">
          <pre id="pre-${ag.id}"></pre>
        </div>`;
      agentsCont.appendChild(card);
    });
  }

  function toggleDetail(id) {
    document.getElementById(`detail-${id}`).classList.toggle('open');
  }

  function updateCard(agentId, status, message, output) {
    const card  = document.getElementById(`card-${agentId}`);
    const badge = document.getElementById(`badge-${agentId}`);
    const msg   = document.getElementById(`msg-${agentId}`);
    const pre   = document.getElementById(`pre-${agentId}`);
    const detail= document.getElementById(`detail-${agentId}`);
    if (!card) return;

    card.className  = `agent-card ${status}`;
    badge.className = `status-badge ${status}`;
    badge.textContent = status;
    msg.textContent = message || '';

    if (output) {
      pre.textContent = JSON.stringify(output, null, 2);
      detail.classList.add('open');
      setTimeout(() => detail.classList.remove('open'), 4000);
    }
  }

  // ── Run pipeline ─────────────────────────────────────────────────────────
  runBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    errBanner.style.display = 'none';
    reportSec.style.display = 'none';
    runBtn.disabled = true;
    buildCards();
    pipeSec.style.display = 'block';

    // Upload
    const form = new FormData();
    form.append('file', selectedFile);
    let fileId;
    try {
      const res = await fetch('/upload', { method: 'POST', body: form });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Upload failed'); }
      const data = await res.json();
      fileId = data.file_id;
    } catch (err) {
      showError(err.message);
      runBtn.disabled = false;
      return;
    }

    // SSE stream
    const es = new EventSource(`/run/${encodeURIComponent(fileId)}`);
    es.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }

      const { agent, status, message, output, report_url, agent_failed, stats } = ev;

      if (status === 'complete') {
        es.close();
        updateCard('orchestrator', 'done', 'All stages complete!', null);
        showReport(report_url, stats);
        runBtn.disabled = false;
        return;
      }
      if (status === 'error') {
        es.close();
        if (agent_failed) updateCard(agent_failed, 'error', message, null);
        updateCard('orchestrator', 'error', message, null);
        showError(`Pipeline failed at ${agent_failed || agent}: ${message}`);
        runBtn.disabled = false;
        return;
      }
      updateCard(agent, status, message, output || null);
    };
    es.onerror = () => {
      es.close();
      showError('Connection to pipeline lost. Check server logs.');
      runBtn.disabled = false;
    };
  });

  function showReport(url, stats) {
    reportUrl = url;
    statsGrid.innerHTML = '';
    const items = [
      { num: (stats?.rows_ingested ?? '—').toLocaleString(),    lbl: 'Rows Ingested' },
      { num: (stats?.rows_after_silver ?? '—').toLocaleString(),lbl: 'Rows After Cleanse' },
      { num: (stats?.anomalies_flagged ?? '—').toLocaleString(),lbl: 'Anomalies Flagged' },
      { num: (stats?.gold_tables ?? '—').toLocaleString(),      lbl: 'Gold Tables' },
    ];
    items.forEach(it => {
      statsGrid.insertAdjacentHTML('beforeend', `
        <div class="stat-box">
          <div class="num">${it.num}</div>
          <div class="lbl">${it.lbl}</div>
        </div>`);
    });
    reportSec.style.display = 'block';
    reportSec.scrollIntoView({ behavior: 'smooth' });
  }

  openRepBtn.addEventListener('click', () => {
    if (reportUrl) window.open(reportUrl, '_blank');
  });

  function showError(msg) {
    errBanner.textContent = '&#10060; ' + msg;
    errBanner.style.display = 'block';
  }
</script>
</body>
</html>
