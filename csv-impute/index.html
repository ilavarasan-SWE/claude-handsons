<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Mean Imputer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Data Cleanup Utility</p>
      <h1>CSV Mean Imputer</h1>
      <p class="subtitle">Upload a CSV file, fill numeric missing values with each column mean, and download the cleaned result.</p>
    </header>

    <section class="card">
      <label for="csvFile" class="file-label">Choose CSV File</label>
      <input id="csvFile" type="file" accept=".csv,text/csv" />

      <div class="actions">
        <button id="imputeBtn" disabled>Impute Missing Values</button>
        <button id="downloadBtn" disabled>Download Imputed CSV</button>
      </div>

      <p id="status" class="status">No file selected.</p>
      <div id="summary" class="summary" aria-live="polite"></div>
    </section>

    <section class="card preview-card">
      <h2>Preview (first 8 rows)</h2>
      <div id="preview" class="preview-placeholder">Upload a CSV file to see a preview.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
